plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
    id 'war'
    id 'com.google.cloud.tools.jib' version '3.4.3'
}

group = 'com.sqool'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    
    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    
    // Liquibase
    implementation 'org.liquibase:liquibase-core'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Jackson Hibernate Module
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6:2.15.4'
    
    // Utilities
    implementation 'org.apache.commons:commons-lang3'
    
    // OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    
    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    enabled = true
}

tasks.named('bootWar') {
    enabled = true
    archiveFileName = 'sqoolbus.war'
}

jib {
    from {
        image = 'eclipse-temurin:17-jre'
        platforms {
            platform {
                os = 'linux'
                architecture = System.getProperty('os.arch') == 'aarch64' ? 'arm64' : 'amd64'
            }
        }
    }
    to {
        image = 'sqool-app'
        tags = ['latest']
    }
    container {
        ports = ['8080', '5005']
        jvmFlags = ['-XX:+UseContainerSupport', '-XX:MaxRAMPercentage=75.0']
        environment = ['JAVA_OPTS': '']
    }
}

// Gradle wrapper configuration
wrapper {
    gradleVersion = '8.5'
}
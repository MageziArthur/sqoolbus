spring:
  application:
    name: sqoolbus
  
  main:
    allow-circular-references: true
  
  profiles:
    active: dev
  
  # Master Database Configuration
  datasource:
    master:
      url: ${MASTER_DB_URL}
      username: ${MASTER_DB_USERNAME}
      password: ${MASTER_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 300000
        connection-timeout: 20000
    
    # Default Tenant Database Configuration
    tenant:
      default:
        url: ${TENANT_DB_URL}
        username: ${TENANT_DB_USERNAME}
        password: ${TENANT_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          idle-timeout: 300000
          connection-timeout: 20000

  # JPA Configuration
  jpa:
    open-in-view: false # Disable to prevent lazy loading issues during serialization
    hibernate:
      ddl-auto: none # We'll use Liquibase for schema management
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        enable_lazy_load_no_trans: true

  # Liquibase Configuration
  liquibase:
    enabled: false # We'll configure it manually for multitenant support

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:sqoolbus-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
    expiration: ${JWT_EXPIRATION:86400} # 24 hours in seconds
  security:
    inactivity-timeout-minutes: 5 # Session timeout after 5 minutes of inactivity

# Custom Application Properties
sqoolbus:
  see_test_data: ${SEE_TEST_DATA:true}
  multitenancy:
    default-tenant: ${DEFAULT_TENANT_ID:default_sqool}
    tenant-header: ${TENANT_HEADER:X-Tenant-ID}
    master-datasource:
      schema: ${MASTER_SCHEMA}
    
# Logging Configuration
logging:
  level:
    com.sqool.sqoolbus: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: INFO

server:
  port: ${SERVER_PORT:8080}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    master:
      url: ${MASTER_DB_URL}
      username: ${MASTER_DB_USERNAME:root}
      password: ${MASTER_DB_PASSWORD:rootpassword}
      driver-class-name: ${DRIVER:com.mysql.cj.jdbc.Driver}
    
    tenant:
      default:
        url: ${TENANT_DB_URL}
        username: ${TENANT_DB_USERNAME:root}
        password: ${TENANT_DB_PASSWORD:rootpassword}
        driver-class-name: ${DRIVER:com.mysql.cj.jdbc.Driver}
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  
  h2:
    console:
      enabled: false

# Sqoolbus Configuration
sqoolbus:
  database:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    username: ${MASTER_DB_USERNAME:root}
    password: ${MASTER_DB_PASSWORD:rootpassword}
    name: ${MYSQL_MASTER_DB:sqoolbus_master}
  tenant:
    default: ${MYSQL_TENANT_DB:default_sqool}
  security:
    enforce-2fa: ${ENFORCE_2FA:false}

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
      
  jpa:
    show-sql: false
    
logging:
  level:
    com.sqool.sqoolbus: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
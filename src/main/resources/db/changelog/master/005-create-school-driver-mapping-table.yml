databaseChangeLog:
  - changeSet:
      id: 005-create-school-driver-mapping-table
      author: system
      changes:
        - createTable:
            tableName: school_driver_mappings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: school_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: school_name
                  type: VARCHAR(200)
              - column:
                  name: assignment_date
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_school_driver_mapping_driver
            baseTableName: school_driver_mappings
            baseColumnNames: driver_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            constraintName: fk_school_driver_mapping_tenant
            baseTableName: school_driver_mappings
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_school_driver_mapping_driver_id
            tableName: school_driver_mappings
            columns:
              - column:
                  name: driver_id

        - createIndex:
            indexName: idx_school_driver_mapping_tenant_id
            tableName: school_driver_mappings
            columns:
              - column:
                  name: tenant_id

        - createIndex:
            indexName: idx_school_driver_mapping_school_id
            tableName: school_driver_mappings
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: school_id

        - createIndex:
            indexName: idx_school_driver_mapping_active
            tableName: school_driver_mappings
            columns:
              - column:
                  name: is_active

      rollback:
        - dropTable:
            tableName: school_driver_mappings

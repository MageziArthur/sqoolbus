databaseChangeLog:
  - changeSet:
      id: create-parent-pupil-mapping-table
      author: system
      changes:
        - createTable:
            tableName: parent_pupil_mappings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: pupil_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: pupil_first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: pupil_last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: VARCHAR(100)
              - column:
                  name: grade_level
                  type: VARCHAR(50)
              - column:
                  name: school_name
                  type: VARCHAR(255)
              - column:
                  name: school_id
                  type: BIGINT
              - column:
                  name: route_name
                  type: VARCHAR(255)
              - column:
                  name: route_id
                  type: BIGINT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: parent_pupil_mappings
            baseColumnNames: parent_id
            constraintName: fk_parent_pupil_mapping_parent
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: parent_pupil_mappings
            baseColumnNames: tenant_id
            constraintName: fk_parent_pupil_mapping_tenant
            referencedTableName: tenants
            referencedColumnNames: tenant_id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_parent_pupil_mapping_parent_id
            tableName: parent_pupil_mappings
            columns:
              - column:
                  name: parent_id
        - createIndex:
            indexName: idx_parent_pupil_mapping_tenant_id
            tableName: parent_pupil_mappings
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            indexName: idx_parent_pupil_mapping_pupil_id
            tableName: parent_pupil_mappings
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: pupil_id

              - column:
                  name: is_active
                  value: 1
              - column:
                  name: start_latitude
                  value: 39.7817
              - column:
                  name: start_longitude
                  value: -89.6501
              - column:
                  name: end_latitude
                  value: 39.7817
              - column:
                  name: end_longitude
                  value: -89.6501
              - column:
                  name: school_id
                  valueComputed: "(SELECT id FROM school WHERE school_code = 'DEFAULT_SCHOOL')"
              - column:
                  name: created_by
                  value: "system"
              - column:
                  name: modified_by
                  value: "system"
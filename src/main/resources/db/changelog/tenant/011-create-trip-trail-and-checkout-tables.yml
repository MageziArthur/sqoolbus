databaseChangeLog:
  - changeSet:
      id: 011-create-trip-trail-point-table
      author: sqoolbus
      changes:
        - createTable:
            tableName: trip_trail_point
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trip_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: longitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: modified_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            baseTableName: trip_trail_point
            baseColumnNames: trip_id
            constraintName: fk_trip_trail_point_trip
            referencedTableName: trip
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_trip_trail_point_trip_id
            tableName: trip_trail_point
            columns:
              - column:
                  name: trip_id

        - createIndex:
            indexName: idx_trip_trail_point_recorded_at
            tableName: trip_trail_point
            columns:
              - column:
                  name: recorded_at

  - changeSet:
      id: 011-create-trip-student-checkout-table
      author: sqoolbus
      changes:
        - createTable:
            tableName: trip_student_checkout
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trip_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: pupil_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: checkout_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: latitude
                  type: DECIMAL(10,7)
              - column:
                  name: longitude
                  type: DECIMAL(10,7)
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: modified_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            baseTableName: trip_student_checkout
            baseColumnNames: trip_id
            constraintName: fk_trip_student_checkout_trip
            referencedTableName: trip
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: trip_student_checkout
            baseColumnNames: pupil_id
            constraintName: fk_trip_student_checkout_pupil
            referencedTableName: pupil
            referencedColumnNames: id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_trip_student_checkout_trip_id
            tableName: trip_student_checkout
            columns:
              - column:
                  name: trip_id

        - createIndex:
            indexName: idx_trip_student_checkout_pupil_id
            tableName: trip_student_checkout
            columns:
              - column:
                  name: pupil_id

        - createIndex:
            indexName: idx_trip_student_checkout_time
            tableName: trip_student_checkout
            columns:
              - column:
                  name: checkout_time

        - addUniqueConstraint:
            tableName: trip_student_checkout
            columnNames: trip_id, pupil_id
            constraintName: uq_trip_student_checkout_trip_pupil